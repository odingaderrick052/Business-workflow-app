<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Workflow</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      margin-bottom: 10px;
    }
    nav a {
      margin-right: 15px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
    nav a:hover {
      color: #0066cc;
    }
    button {
      margin: 20px 0;
      padding: 10px 16px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #eee;
    }
  </style>
</head>
<body>

  <h1>BUSINESS WORKFLOW</h1>

  <nav>
    <a href="#">Dashboard</a>
    <a href="#">Customers</a>
    <a href="#">Requests</a>
    <a href="#">Tasks</a>
  </nav>

  <button>+ New Customer</button>

  <h2>Recent Requests</h2>

  <table>
    <thead>
      <tr>
        <th>Customer</th>
        <th>Request</th>
        <th>Status</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>John Doe</td>
        <td>Website redesign</td>
        <td>In Progress</td>
        <td>2026-08-10</td>
      </tr>
      <tr>
        <td>Jane Smith</td>
        <td>Logo design</td>
        <td>Completed</td>
        <td>2026-08-08</td>
      </tr>
    </tbody>
  </table>

</body>
  </html>
